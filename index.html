      (function() {
        try {
          var originalFetch = window.fetch;
          Object.defineProperty(window, 'fetch', {
            configurable: true,
            enumerable: true,
            get: function() {
              return originalFetch;
            },
            set: function(val) {
              originalFetch = val;
            }
          });
        } catch (e) {
          try {
            var protoFetch = Window.prototype.fetch;
            Object.defineProperty(Window.prototype, 'fetch', {
              configurable: true,
              enumerable: true,
              get: function() {
                return protoFetch;
              },
              set: function(val) {
                protoFetch = val;
              }
            });
          } catch (err) {}
        }
      })();
    </script>
